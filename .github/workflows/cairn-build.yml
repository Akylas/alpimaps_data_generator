# Build Cairn, for a release or just to try it.
#
# One definition, two callers: `cairn-release.yml` calls it with a tag and a draft release to
# attach to, and a manual run builds the same thing and leaves the results as workflow artifacts.
# A test build creates no tag, no release and no version bump - it exists so a branch can be
# built and handed to someone without cutting a version for it.
name: Cairn build

on:
  workflow_call:
    inputs:
      version:
        description: 'Version the bundles carry, as a tag (v1.2.3).'
        required: true
        type: string
      release_id:
        description: 'Draft release to attach the bundles to. Empty builds without publishing.'
        required: false
        default: ''
        type: string
    secrets:
      # the caller passes these through with `secrets: inherit`
      APPLE_CERTIFICATE: { required: false }
      APPLE_CERTIFICATE_PASSWORD: { required: false }
      APPLE_ID: { required: false }
      APPLE_IDENTITY_ID: { required: false }
      APPLE_PASSWORD: { required: false }
      APPLE_PROVIDER_SHORT_NAME: { required: false }
      APPLE_TEAM_ID: { required: false }
      TAURI_SIGNING_PRIVATE_KEY: { required: false }
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: { required: false }

  workflow_dispatch:
    inputs:
      version:
        description: 'What the bundles should call themselves. Any string; nothing is tagged.'
        required: false
        default: 'test'
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows is left out on purpose: Valhalla's support for it is poor and this pipeline has
        # never been run there.
        # 22.04 sets the glibc floor at 2.35, which is what lets one Linux build run on 22.04,
        # 24.04 and Debian 12 alike. Its compiler is too old for Valhalla - see below - so a
        # newer one is installed rather than a newer runner used.
        platform: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # a release build takes the tag, because a manual run bumps the version *after* the
          # commit it started from and the bundles carry that version. A test build has no tag
          # and takes the ref it was dispatched on.
          ref: ${{ inputs.release_id != '' && inputs.version || github.ref }}

      - name: Record dependency revisions
        id: revs
        run: |
          set -euo pipefail
          echo "valhalla=$(git -C valhalla rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "planetiler=$(git -C planetiler rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Tauri v2 links against the 4.1 webkit2gtk, not the 4.0 the v1 template installed, and
      # against the ayatana fork of libappindicator
      - name: Install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf \
            cmake make libtool pkg-config ccache \
            libcurl4-openssl-dev zlib1g-dev liblz4-dev \
            libsqlite3-dev libspatialite-dev \
            libluajit-5.1-dev libgeos++-dev libgeos-dev spatialite-bin

      # Valhalla 3.8 is C++20 and midgard/logging.h includes <format>, which arrived in GCC 13.
      # 22.04 ships GCC 11, so the build dies on the first translation unit.
      #
      # The compiler is installed rather than the runner moved to 24.04, because the runner sets
      # the glibc floor: a binary built on 24.04 wants glibc 2.39 and will not start on 22.04.
      # Building on 22.04 with a newer compiler gets both.
      #
      # -static-libstdc++ is the other half. GCC 13's <format> pulls in GLIBCXX_3.4.31 and .32,
      # which 22.04's libstdc++ does not have, so a dynamically linked binary fails to start on
      # the very release it was built on. Linked statically it needs no GLIBCXX symbols at all.
      - name: Install a compiler new enough for Valhalla (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y g++-13 gcc-13
          g++-13 --version | head -1
          # for everything downstream: cc-rs compiles the Valhalla shim, which includes those
          # same headers, and cargo links the final binaries
          {
            echo "CC=gcc-13"
            echo "CXX=g++-13"
            echo "RUSTFLAGS=-C link-arg=-static-libstdc++ -C link-arg=-static-libgcc"
            # the protobuf built in the next step: found by cargo test, by ldd while the
            # libraries are being collected, and by anything else the build runs
            echo "LD_LIBRARY_PATH=/opt/protobuf/lib"
          } >> "$GITHUB_ENV"

      # No dylibbundler: scripts/bundle_macos_dylibs.sh does the same job with otool and
      # install_name_tool, which ship with the Command Line Tools.
      - name: Install system dependencies (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          brew update
          # spatialite-tools is not optional: Valhalla's CMake hard-fails without the
          # `spatialite` and `spatialite_tool` binaries, which it uses to build tz.sqlite.
          # libspatialite is the library only, so a machine with it still fails configure.
          brew install autoconf automake libtool cmake ccache boost protobuf \
                       libspatialite spatialite-tools sqlite3 luajit geos lz4 pkg-config

      # ---------------------------------------------------------------- Valhalla
      #
      # ENABLE_SERVICES=Off drops prime_server and zmq. The app embeds tyr::actor_t rather than
      # talking to valhalla_service, so the whole HTTP stack - and the hand-built prime_server
      # submodule with it - is off the release path.

      # 22.04 ships Boost 1.74, and Valhalla's adminbuilder.cc calls boost::geometry::area on a
      # geographic polygon having included only algorithms/area.hpp. In 1.74 the geographic
      # default strategy is not visible from there and the build stops on
      # NOT_IMPLEMENTED_FOR_THIS_COORDINATE_SYSTEM; 1.83 - what 24.04 ships - compiles it.
      #
      # Headers only, and nothing to build: Valhalla does `find_package(Boost 1.71 REQUIRED)`
      # with no components and links Boost::boost.
      - name: Boost headers cache
        id: boost-cache
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@v4
        with:
          path: /opt/boost
          key: boost-1.83.0-headers

      - name: Fetch Boost headers (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' && steps.boost-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/boost/include
          curl -fsSL https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.gz |
            sudo tar -xz -C /opt/boost/include --strip-components=1 boost_1_83_0/boost
          grep BOOST_LIB_VERSION /opt/boost/include/boost/version.hpp

      # 22.04 ships protobuf 3.12, which predates proto3 `optional` - so the generated code has
      # no has_x() accessors and Valhalla does not compile against it:
      #
      #   landmarks.cc:48: 'class valhalla::Location' has no member named 'has_node_snap_tolerance'
      #
      # 21.12 is what 24.04 ships, and is the last release before the abseil dependency, so it
      # builds on its own. Shared rather than static, to match how Valhalla is compiled - the
      # shim in core/build.rs defines PROTOBUF_USE_DLLS, and that has to be true.
      - name: Protobuf cache
        id: protobuf-cache
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@v4
        with:
          path: /opt/protobuf
          key: protobuf-3.21.12-${{ matrix.platform }}

      - name: Build protobuf (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' && steps.protobuf-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protobuf-cpp-3.21.12.tar.gz |
            tar -xz -C /tmp
          cmake -S /tmp/protobuf-3.21.12 -B /tmp/protobuf-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/protobuf \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_SHARED_LIBS=ON
          cmake --build /tmp/protobuf-build -j"$(getconf _NPROCESSORS_ONLN)"
          sudo cmake --install /tmp/protobuf-build
          sudo chown -R "$(id -u):$(id -g)" /opt/protobuf
          /opt/protobuf/bin/protoc --version

      # Two caches, doing different jobs.
      #
      # The build tree is the fast path: an unchanged submodule means nothing to do at all. But
      # it only ever hits exactly, and the moment the submodule moves it is worth nothing on its
      # own - which is what ccache is for. Restored by prefix, it turns a submodule bump into a
      # rebuild of what actually changed rather than 180 files.
      #
      # Valhalla wires ccache itself (ENABLE_CCACHE, on by default) when it finds one on PATH,
      # and both runners have it installed. CCACHE_DIR is set explicitly because the default
      # differs by platform.
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.platform }}-${{ steps.revs.outputs.valhalla }}
          restore-keys: |
            ccache-${{ matrix.platform }}-

      - name: Point ccache at that directory
        run: |
          set -euo pipefail
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"

      - name: Valhalla build cache
        id: valhalla-cache
        uses: actions/cache@v4
        with:
          path: valhalla/build
          # Hashing this file covers the compiler, the flags and the dependency versions, which
          # are all written here - so changing any of them invalidates the tree without anyone
          # having to remember to bump a tag by hand.
          #
          # restore-keys means a miss still restores the newest tree for this platform. CMake
          # reconfigures if the flags moved, make rebuilds what the submodule changed, and
          # ccache answers most of the rest.
          key: valhalla-${{ matrix.platform }}-${{ hashFiles('.github/workflows/cairn-build.yml') }}-${{ steps.revs.outputs.valhalla }}
          restore-keys: |
            valhalla-${{ matrix.platform }}-

      # Runs whenever the key was not an exact hit - including a prefix restore, where most of
      # the tree is reusable and only the delta gets built.
      - name: Build Valhalla
        if: steps.valhalla-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          extra=()
          if [ "${{ matrix.platform }}" = ubuntu-22.04 ]; then
            extra=(-DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
                   -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
                   -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
                   -DBOOST_ROOT=/opt/boost -DBoost_NO_SYSTEM_PATHS=ON
                   -DCMAKE_PREFIX_PATH=/opt/protobuf
                   # Valhalla links protobuf-lite as a bare path in module-compatible mode,
                   # which carries no include directories with it, so the targets that see only
                   # that one cannot find google/protobuf/port_def.inc. This puts the directory
                   # on every compile line - including the one build.rs reads back out of
                   # flags.make for the shim.
                   -DCMAKE_CXX_STANDARD_INCLUDE_DIRECTORIES=/opt/protobuf/include)
          fi
          cmake -S valhalla -B valhalla/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SERVICES=Off \
            -DENABLE_BENCHMARKS=Off \
            -DENABLE_PYTHON_BINDINGS=Off \
            -DENABLE_TESTS=Off \
            -DENABLE_TOOLS=Off \
            ${extra[@]+"${extra[@]}"}
          # Only what is shipped. `all` builds 26 executables, of which the bundle carries one:
          # valhalla_build_tiles. Each of the other 25 links the 40 MB archive to produce
          # something that is then thrown away - the library and that one tool take 87s here,
          # against many minutes for the rest.
          #
          # ENABLE_DATA_TOOLS stays on: it is what gates mjolnir, and mjolnir is the tile
          # builder. ENABLE_TOOLS=Off above drops valhalla_service and friends, and with services
          # already off it takes the libgeotiff dependency with it.
          cmake --build valhalla/build -j"$(getconf _NPROCESSORS_ONLN)" \
            --target valhalla valhalla_build_tiles
          # worth having in the log: it says whether the compiler cache did anything, which is
          # the difference between a rebuild of the delta and a rebuild of everything
          ccache -s 2>/dev/null | head -5 || true

      # ---------------------------------------------------------------- Planetiler

      # The jar is published by .github/workflows/planetiler-jar.yml and fetched here, rather
      # than built again per platform: it is the same jar on every one, and building it costs
      # about eight minutes each time.
      #
      # It is bundled so a released app works offline. Without it the app still runs and fetches
      # the jar itself on first use - which is what BUNDLE_JAR=0 leaves it to do.
      # `planetiler-latest` is a tag that moves, so the revision alone cannot say whether the
      # jar changed - the jar workflow can republish the same submodule commit. The asset's ETag
      # can, and a HEAD request costs nothing next to 76 MB.
      - name: Identify the published jar
        id: jar
        env:
          JAR_URL: https://github.com/${{ github.repository }}/releases/download/planetiler-latest/planetiler-with-deps.jar
        run: |
          set -euo pipefail
          echo "url=$JAR_URL" >> "$GITHUB_OUTPUT"
          etag="$(curl -fsIL --retry 2 "$JAR_URL" 2>/dev/null |
            awk 'tolower($1) == "etag:" { gsub(/[\"\r]/, "", $2); print $2 }' | tail -1 || true)"
          # no ETag (or no release yet) falls back to the revision, which is right often enough
          # and never serves a jar under a key that claims to be a different one
          echo "id=${etag:-rev-${{ steps.revs.outputs.planetiler }}}" >> "$GITHUB_OUTPUT"

      - name: Planetiler jar cache
        id: jar-cache
        uses: actions/cache@v4
        with:
          # outside the workspace on purpose: bundle_resources.sh strips the jar to one
          # platform's natives, and a stripped jar must never be what the cache hands the other
          path: /tmp/planetiler-jar
          key: planetiler-jar-${{ steps.jar.outputs.id }}

      - name: Fetch the planetiler jar
        if: steps.jar-cache.outputs.cache-hit != 'true'
        env:
          JAR_URL: ${{ steps.jar.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/planetiler-jar
          if ! curl -fSL --retry 3 -o /tmp/planetiler-jar/planetiler-with-deps.jar "$JAR_URL"; then
            rm -f /tmp/planetiler-jar/planetiler-with-deps.jar
            echo "::warning::no published jar at $JAR_URL - run the Planetiler jar workflow." \
                 "The app will fetch one on first use instead."
          fi

      # PLANETILER_JAR rather than a copy into resources/: bundle_resources.sh strips the jar to
      # this platform's natives on the way in, and it only does that for a jar it was pointed at.
      # Copied straight into resources/ it was bundled whole, and the script warned about a jar
      # it could not find while an unstripped one sat next to it.
      - name: Point the bundle at the jar
        run: |
          set -euo pipefail
          jar=/tmp/planetiler-jar/planetiler-with-deps.jar
          if [ -f "$jar" ]; then
            echo "PLANETILER_JAR=$jar" >> "$GITHUB_ENV"
            echo "$(du -h "$jar" | cut -f1) jar, cached: ${{ steps.jar-cache.outputs.cache-hit }}"
          fi

      # ---------------------------------------------------------------- App

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: cairn/package-lock.json

      - name: Install deps
        working-directory: cairn
        run: npm ci

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "cairn -> target"

      # A release that silently loses routing is worse than one that fails, and the only way to
      # tell from outside is to ask.
      - name: Fail if Valhalla did not link
        working-directory: cairn
        env:
          VALHALLA_DIR: ${{ github.workspace }}/valhalla
        run: |
          set -euo pipefail
          cargo test -p cairn-core --lib -- valhalla::routing --list > /tmp/routing-tests.txt
          if ! grep -q reports_available_with_valhalla /tmp/routing-tests.txt; then
            echo "Valhalla did not link; the release would ship without routing" >&2
            cat /tmp/routing-tests.txt >&2
            exit 1
          fi

      - name: Test the core
        working-directory: cairn
        env:
          VALHALLA_DIR: ${{ github.workspace }}/valhalla
        run: cargo test -p cairn-core

      # ---------------------------------------------------------------- CLI
      #
      # The command line is released on its own, for anyone who wants the pipeline without the
      # app. It is packaged *before* the bundle is built on purpose: `bundle_resources.sh`
      # rewrites the same binary for the layout inside the .app, and a binary can only point at
      # its libraries one way at a time.
      - name: Build the CLI
        working-directory: cairn
        env:
          VALHALLA_DIR: ${{ github.workspace }}/valhalla
        run: cargo build --release -p cairn-cli

      # `test` on a manual run, `v1.2.3` on a release; the leading v is not part of a version
      - name: Package the CLI standalone
        id: cli
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          # artifact names cannot carry a slash, and a dispatched version can be anything
          echo "slug=${version//\//-}" >> "$GITHUB_OUTPUT"
          ./scripts/package_cli.sh "$version" dist

      # Attached to the same draft release the bundles go to, so one release carries the app and
      # the tool it is a front end for.
      - name: Attach the CLI to the release
        if: inputs.release_id != ''
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.version }}
          artifacts: 'dist/*.tar.gz,dist/*.sha256'
          allowUpdates: true
          draft: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true

      # macOS needs its Homebrew libraries carried into the bundle before anything is signed.
      #
      # Ordering is the whole problem. Rewriting load commands invalidates a signature, so this
      # cannot run after signing; and the .app does not exist until bundling, so it cannot run
      # before the build either. `beforeBundleCommand` is the one point in between: the binary
      # is linked, the bundle is not yet assembled, and nothing has been signed.
      #
      # tauri.conf.json points that hook at this script on macOS.
      - name: Check the dylib bundler is wired in (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          test -x scripts/bundle_macos_dylibs.sh
          grep -q bundle_macos_dylibs cairn/src-tauri/tauri.conf.json

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the script re-signs ad-hoc after rewriting; passing the real identity here makes it
          # sign with that instead, so tauri's own signing pass has less to redo
          MACOS_SIGN_IDENTITY: ${{ secrets.APPLE_IDENTITY_ID }}
          # build.rs reads this to find libvalhalla and the CMake link line. Unset, the app still
          # builds and routing reports itself unavailable - so a missing secret degrades the
          # release rather than failing it, which is worth knowing when one comes out unrouteable.
          VALHALLA_DIR: ${{ github.workspace }}/valhalla
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ENABLE_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_IDENTITY_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        with:
          projectPath: cairn
          # empty on a test build, which makes tauri-action build without publishing anything
          releaseId: ${{ inputs.release_id }}

      # The load commands are rewritten before the bundle exists, against a predicted layout.
      # That prediction has been wrong twice, and both times every static check passed while
      # nothing in the bundle could start. This resolves them against what was actually built.
      # The same question as the macOS check, asked of the .deb: the rpaths were written against
      # a predicted install layout, and the libraries that had to travel are the ones whose
      # sonames differ between releases - so a package that looks right on the runner is exactly
      # what fails on 24.04.
      - name: Verify the package is self-contained (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          deb="$(ls -1 cairn/target/release/bundle/deb/*.deb | head -1)"
          ./scripts/verify_deb.sh "$deb"

      - name: Verify the bundle is self-contained (macOS only)
        if: matrix.platform == 'macos-latest'
        run: ./scripts/verify_bundle.sh "cairn/target/release/bundle/macos/Cairn.app"

      # Uploaded on every run, release or not. On a test build these are the only output; on a
      # release they are a second copy that outlives a draft being deleted after a failure.
      - name: Upload the bundles as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cairn-${{ steps.cli.outputs.slug }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            cairn/target/release/bundle/dmg/*.dmg
            cairn/target/release/bundle/macos/*.app.tar.gz
            cairn/target/release/bundle/deb/*.deb
            cairn/target/release/bundle/appimage/*.AppImage
            cairn/target/release/bundle/rpm/*.rpm
            dist/*.tar.gz
            dist/*.sha256
