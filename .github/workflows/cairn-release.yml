# Release build for Cairn.
#
# Structure follows release.yml: a manual run cuts the version itself with standard-version, a
# tag push takes the version already written down, the release is created as a draft, the
# platform builds attach their bundles, and a failure takes the draft and the tag back out again.
#
# The release carries the app bundles and the `cairn` command line packaged on its own per
# platform - same binary, without the app around it.
#
# The build itself lives in cairn-build.yml, which can also be run on its own to get the same
# bundles as workflow artifacts without cutting a version.
#
# npm rather than yarn, because that is what cairn/ uses.
name: Cairn release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'How much to bump the version. `auto` reads the conventional commits since the last tag and decides.'
        type: choice
        default: auto
        options: [auto, patch, minor, major]

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    # a manual run writes the release commit and tag back to the branch
    permissions:
      contents: write
    outputs:
      RELEASE_UPLOAD_ID: ${{ steps.create_release.outputs.id }}
      RELEASE_TAG: v${{ steps.tag_name.outputs.current_version }}
      # SHA before standard-version ran; the cleanup job resets to it on failure
      PRE_BUMP_SHA: ${{ steps.pre_bump.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          # standard-version reads the tags and the commits since the last one to work out an
          # `auto` bump, and there is nothing to read in a shallow clone
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      # the root package.json carries only the release tooling; the app has its own
      - name: Install release tooling
        run: npm ci

      - name: Record pre-bump commit SHA
        id: pre_bump
        if: github.event_name == 'workflow_dispatch'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The 0.1.2 run cut a version whose only commit was the previous release commit, pushed a
      # tag for it, and then fell over on the empty changelog it had just written - leaving a tag
      # and a version bump on the branch with no release behind them. Nothing to release is not a
      # failure worth that mess, so it stops here, before anything is written.
      #
      # Only `auto` is held to this: choosing a bump by hand is a deliberate act, and re-cutting a
      # version over unreleasable commits is a legitimate thing to want.
      - name: Check there is something to release
        if: github.event_name == 'workflow_dispatch' && inputs.bump == 'auto'
        run: |
          set -euo pipefail
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          range="${last:+$last..}HEAD"
          # the types standard-version puts in a changelog, plus breaking changes of any type
          if git log "$range" --format='%s%n%b' | grep -Eq '^(feat|fix|perf|revert)(\(.+\))?!?:|^BREAKING CHANGE'; then
            echo "commits to release since ${last:-the first commit}"
          else
            echo "::error::Nothing to release since ${last:-the first commit}: no feat/fix/perf/revert or breaking-change commits. Pick an explicit bump if you mean to cut a version anyway."
            exit 1
          fi

      # A tag push arrives with the version already decided and written down. A manual run has
      # neither, so it cuts the release here: standard-version bumps the root package.json, the
      # Cargo workspace and tauri.conf.json (see .versionrc.js), writes the CHANGELOG entry the
      # next step goes looking for, commits and tags.
      #
      # Pushing with GITHUB_TOKEN does not start another workflow run, so the `v*` tag this
      # creates cannot set the whole thing going a second time.
      - name: Cut the release commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          # through the environment rather than inlined: an input is whatever the person who
          # started the run chose
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BUMP" = auto ]; then
            npx standard-version --commit-all
          else
            npx standard-version --commit-all --release-as "$BUMP"
          fi
          git push --follow-tags origin "HEAD:$GITHUB_REF_NAME"

      - name: Work out which version is being released
        id: tag_name
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            # a tag push says so itself
            refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
            # otherwise it is the tag the step above just wrote. `--match` matters: the
            # planetiler jar has its own tags in this repository, and `planetiler-latest` moves,
            # so an unfiltered describe can hand back a tag that is not a release of the app.
            *) version=$(git describe --tags --abbrev=0 --match 'v[0-9]*') ;;
          esac
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "no version on the ref and no tag to read one off" >&2
            exit 1
          fi
          echo "releasing $version"
          echo "current_version=$version" >> "$GITHUB_OUTPUT"

      # Not mindsers/changelog-reader-action: that reads Keep a Changelog (`## [0.1.1] - date`)
      # and standard-version writes its own shapes (`### [0.1.1](compare-url) (date)`), so the
      # release failed on a changelog it had just written itself.
      - name: Get the changelog entry
        id: changelog
        env:
          VERSION: ${{ steps.tag_name.outputs.current_version }}
        run: |
          set -euo pipefail
          {
            echo "changes<<CHANGELOG_EOF"
            ./scripts/changelog_entry.sh "$VERSION"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: create release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.tag_name.outputs.current_version }}
          name: v${{ steps.tag_name.outputs.current_version }}
          body: ${{ steps.changelog.outputs.changes }}
          # a version with a dash in it is a prerelease: 0.2.0-rc.1, and nothing else
          prerelease: ${{ contains(steps.tag_name.outputs.current_version, '-') }}
          # created as a draft; published once every platform has succeeded
          draft: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    uses: ./.github/workflows/cairn-build.yml
    with:
      version: ${{ needs.create-release.outputs.RELEASE_TAG }}
      release_id: ${{ needs.create-release.outputs.RELEASE_UPLOAD_ID }}
    # the signing and updater secrets, which the called workflow declares
    secrets: inherit

  update-release:
    runs-on: ubuntu-latest
    needs: [create-release, build]
    if: ${{ always() && needs.create-release.result == 'success' && needs.build.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Publish release as latest
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.create-release.outputs.RELEASE_TAG }}
          draft: false
          makeLatest: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true

  # If any build fails, delete the draft release and the tag. A workflow_dispatch run also
  # reverts the version-bump commit it already pushed. A tag-push run has nothing to revert, but
  # the draft and tag still have to go so the version can be re-released later.
  cleanup-on-failure:
    runs-on: ubuntu-latest
    needs: [create-release, build]
    # Also on a create-release failure: by the time it can fail, the version bump and the tag are
    # already pushed. The 0.1.2 run failed exactly there, and cleanup sat it out because it only
    # looked at the build.
    if: >-
      ${{ always()
          && (needs.create-release.result == 'failure'
              || (needs.create-release.result == 'success' && needs.build.result == 'failure')) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete tag and revert version bump commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.RELEASE_TAG }}
          PRE_BUMP_SHA: ${{ needs.create-release.outputs.PRE_BUMP_SHA }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # a create-release that failed before the tag step leaves RELEASE_TAG as a bare "v"
          if [ -n "${RELEASE_TAG#v}" ]; then
            # ignore errors: the tag may never have been pushed
            git push --delete origin "$RELEASE_TAG" || true
            gh release delete "$RELEASE_TAG" --yes || true
          fi
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ -n "$PRE_BUMP_SHA" ]; then
            git fetch origin "$GITHUB_REF_NAME"
            git checkout "$GITHUB_REF_NAME"
            git reset --hard "$PRE_BUMP_SHA"
            git push --force-with-lease origin "HEAD:$GITHUB_REF_NAME"
          fi
