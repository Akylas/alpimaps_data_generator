# Release build for AlpiMaps Studio.
#
# Structure follows release.yml: a manual run cuts the version itself with standard-version, a
# tag push takes the version already written down, the release is created as a draft, the
# platform builds attach their bundles, and a failure takes the draft and the tag back out again.
#
# What is different is underneath. The app links Valhalla and ships the Planetiler jar, so both
# are built from the submodules before Tauri runs, and cached against their commit SHAs - the
# Valhalla build is tens of minutes and neither moves between most runs.
#
# npm rather than yarn, because that is what alpimaps-studio/ uses.
name: Studio release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'How much to bump the version. `auto` reads the conventional commits since the last tag and decides.'
        type: choice
        default: auto
        options: [auto, patch, minor, major]

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    # a manual run writes the release commit and tag back to the branch
    permissions:
      contents: write
    outputs:
      RELEASE_UPLOAD_ID: ${{ steps.create_release.outputs.id }}
      RELEASE_TAG: v${{ steps.changelog_reader.outputs.version }}
      # SHA before standard-version ran; the cleanup job resets to it on failure
      PRE_BUMP_SHA: ${{ steps.pre_bump.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          # standard-version reads the tags and the commits since the last one to work out an
          # `auto` bump, and there is nothing to read in a shallow clone
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      # the root package.json carries only the release tooling; the app has its own
      - name: Install release tooling
        run: npm ci

      - name: Record pre-bump commit SHA
        id: pre_bump
        if: github.event_name == 'workflow_dispatch'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A tag push arrives with the version already decided and written down. A manual run has
      # neither, so it cuts the release here: standard-version bumps the root package.json, the
      # Cargo workspace and tauri.conf.json (see .versionrc.js), writes the CHANGELOG entry the
      # next step goes looking for, commits and tags.
      #
      # Pushing with GITHUB_TOKEN does not start another workflow run, so the `v*` tag this
      # creates cannot set the whole thing going a second time.
      - name: Cut the release commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          # through the environment rather than inlined: an input is whatever the person who
          # started the run chose
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BUMP" = auto ]; then
            npx standard-version --commit-all
          else
            npx standard-version --commit-all --release-as "$BUMP"
          fi
          git push --follow-tags origin "HEAD:$GITHUB_REF_NAME"

      - name: Work out which version is being released
        id: tag_name
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            # a tag push says so itself
            refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
            # otherwise it is the tag the step above just wrote
            *) version=$(git describe --tags --abbrev=0) ;;
          esac
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "no version on the ref and no tag to read one off" >&2
            exit 1
          fi
          echo "releasing $version"
          echo "current_version=$version" >> "$GITHUB_OUTPUT"

      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.tag_name.outputs.current_version }}
          path: ./CHANGELOG.md

      - name: create release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.changelog_reader.outputs.version }}
          name: v${{ steps.changelog_reader.outputs.version }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          prerelease: ${{ steps.changelog_reader.outputs.status == 'prereleased' }}
          # created as a draft; published once every platform has succeeded
          draft: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # Windows is left out on purpose: Valhalla's support for it is poor and this pipeline has
        # never been run there.
        platform: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # the tag, not the commit the run started from: a manual run bumps the version after
          # that commit, and the bundles carry it
          ref: ${{ needs.create-release.outputs.RELEASE_TAG }}

      - name: Record dependency revisions
        id: revs
        run: |
          set -euo pipefail
          echo "valhalla=$(git -C valhalla rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "planetiler=$(git -C planetiler rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Tauri v2 links against the 4.1 webkit2gtk, not the 4.0 the v1 template installed, and
      # against the ayatana fork of libappindicator
      - name: Install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf \
            cmake make libtool pkg-config g++ ccache \
            libboost-all-dev libcurl4-openssl-dev zlib1g-dev liblz4-dev \
            libprotobuf-dev protobuf-compiler libsqlite3-dev libspatialite-dev \
            libluajit-5.1-dev libgeos++-dev libgeos-dev spatialite-bin

      # No dylibbundler: scripts/bundle_macos_dylibs.sh does the same job with otool and
      # install_name_tool, which ship with the Command Line Tools.
      - name: Install system dependencies (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          brew update
          brew install autoconf automake libtool cmake ccache boost protobuf \
                       libspatialite sqlite3 luajit geos lz4 pkg-config

      # ---------------------------------------------------------------- Valhalla
      #
      # ENABLE_SERVICES=Off drops prime_server and zmq. The app embeds tyr::actor_t rather than
      # talking to valhalla_service, so the whole HTTP stack - and the hand-built prime_server
      # submodule with it - is off the release path.

      - name: Valhalla build cache
        id: valhalla-cache
        uses: actions/cache@v4
        with:
          path: valhalla/build
          key: valhalla-${{ matrix.platform }}-${{ steps.revs.outputs.valhalla }}

      - name: Build Valhalla
        if: steps.valhalla-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cmake -S valhalla -B valhalla/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SERVICES=Off \
            -DENABLE_BENCHMARKS=Off \
            -DENABLE_PYTHON_BINDINGS=Off \
            -DENABLE_TESTS=Off
          cmake --build valhalla/build -j"$(getconf _NPROCESSORS_ONLN)"

      # ---------------------------------------------------------------- Planetiler

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Planetiler jar cache
        id: planetiler-cache
        uses: actions/cache@v4
        with:
          path: planetiler/planetiler-dist/target/*-with-deps.jar
          key: planetiler-${{ steps.revs.outputs.planetiler }}

      - name: Build Planetiler
        if: steps.planetiler-cache.outputs.cache-hit != 'true'
        working-directory: planetiler
        run: ./scripts/build.sh

      # The jar ships as a bundled resource so a released build works offline; without it the app
      # falls back to downloading a JRE and jar, which is fine in development and not in a release
      - name: Stage Planetiler as a bundled resource
        run: |
          set -euo pipefail
          mkdir -p alpimaps-studio/src-tauri/resources
          cp planetiler/planetiler-dist/target/*-with-deps.jar \
             alpimaps-studio/src-tauri/resources/planetiler.jar

      # ---------------------------------------------------------------- App

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: alpimaps-studio/package-lock.json

      - name: Install deps
        working-directory: alpimaps-studio
        run: npm ci

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "alpimaps-studio -> target"

      # A release that silently loses routing is worse than one that fails, and the only way to
      # tell from outside is to ask.
      - name: Fail if Valhalla did not link
        working-directory: alpimaps-studio
        env:
          VALHALLA_DIR: ${{ github.workspace }}/valhalla
        run: |
          set -euo pipefail
          cargo test -p studio-core --lib -- valhalla::routing --list > /tmp/routing-tests.txt
          if ! grep -q reports_available_with_valhalla /tmp/routing-tests.txt; then
            echo "Valhalla did not link; the release would ship without routing" >&2
            cat /tmp/routing-tests.txt >&2
            exit 1
          fi

      - name: Test the core
        working-directory: alpimaps-studio
        env:
          VALHALLA_DIR: ${{ github.workspace }}/valhalla
        run: cargo test -p studio-core

      # macOS needs its Homebrew libraries carried into the bundle before anything is signed.
      #
      # Ordering is the whole problem. Rewriting load commands invalidates a signature, so this
      # cannot run after signing; and the .app does not exist until bundling, so it cannot run
      # before the build either. `beforeBundleCommand` is the one point in between: the binary
      # is linked, the bundle is not yet assembled, and nothing has been signed.
      #
      # tauri.conf.json points that hook at this script on macOS.
      - name: Check the dylib bundler is wired in (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          test -x scripts/bundle_macos_dylibs.sh
          grep -q bundle_macos_dylibs alpimaps-studio/src-tauri/tauri.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the script re-signs ad-hoc after rewriting; passing the real identity here makes it
          # sign with that instead, so tauri's own signing pass has less to redo
          MACOS_SIGN_IDENTITY: ${{ secrets.APPLE_IDENTITY_ID }}
          # build.rs reads this to find libvalhalla and the CMake link line. Unset, the app still
          # builds and routing reports itself unavailable - so a missing secret degrades the
          # release rather than failing it, which is worth knowing when one comes out unrouteable.
          VALHALLA_DIR: ${{ github.workspace }}/valhalla
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ENABLE_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_IDENTITY_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        with:
          projectPath: alpimaps-studio
          releaseId: ${{ needs.create-release.outputs.RELEASE_UPLOAD_ID }}

  update-release:
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    if: ${{ always() && needs.create-release.result == 'success' && needs.build-tauri.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Publish release as latest
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.create-release.outputs.RELEASE_TAG }}
          draft: false
          makeLatest: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true

  # If any build fails, delete the draft release and the tag. A workflow_dispatch run also
  # reverts the version-bump commit it already pushed. A tag-push run has nothing to revert, but
  # the draft and tag still have to go so the version can be re-released later.
  cleanup-on-failure:
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    if: >-
      ${{ always()
          && needs.create-release.result == 'success'
          && needs.build-tauri.result == 'failure' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete tag and revert version bump commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.RELEASE_TAG }}
          PRE_BUMP_SHA: ${{ needs.create-release.outputs.PRE_BUMP_SHA }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ignore errors: the tag may never have been pushed
          git push --delete origin "$RELEASE_TAG" || true
          gh release delete "$RELEASE_TAG" --yes || true
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ -n "$PRE_BUMP_SHA" ]; then
            git fetch origin "$GITHUB_REF_NAME"
            git checkout "$GITHUB_REF_NAME"
            git reset --hard "$PRE_BUMP_SHA"
            git push --force-with-lease origin "HEAD:$GITHUB_REF_NAME"
          fi
