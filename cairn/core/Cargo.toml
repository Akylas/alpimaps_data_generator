[package]
name = "cairn-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "sync", "fs"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
flate2 = "1"
zstd = "0.13"
zopfli = "0.8"
base64 = "0.22"
rayon = "1"
tar = "0.4"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
pmtiles = { version = "0.24.0", default-features = false, features = ["write"] }
webp = { version = "0.3", default-features = false }
libwebp-sys = "0.9"

[dev-dependencies]
tempfile = "3"
# mtime is what picks the jar now, so the tests set it rather than racing two writes
filetime = "0.2"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
cc = "1"
