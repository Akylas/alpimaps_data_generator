[workspace]
members = [ "crates/core", "crates/cli", "src-tauri" ]
resolver = "2"

  [workspace.package]
  version = "0.1.2"
  edition = "2021"
  license = "MIT"
  repository = "https://github.com/Akylas/cairn"
  homepage = "https://akylas.github.io/cairn"
  authors = [ "Martin Guillon and Cairn contributors" ]

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
