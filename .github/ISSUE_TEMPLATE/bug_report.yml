name: Bug report
description: Something does not work, or produces the wrong output
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations: { required: true }
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Desktop app, Command line, Both / not sure]
    validations: { required: true }
  - type: input
    id: command
    attributes:
      label: Command or step
      description: The `cairn` command, or the step(s) ticked in the Build tab.
      placeholder: cairn basemap --area rhone-alpes
  - type: input
    id: version
    attributes:
      label: Cairn version
      description: "`cairn --version`, or the version shown in the app."
      placeholder: 0.1.1
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.2 arm64 / Ubuntu 24.04 x86_64
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: The step's output from the Build tab, or the terminal. Please paste text, not a screenshot.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: The area, a `.poly`, option overrides (`-o …`), a screenshot of the map.
